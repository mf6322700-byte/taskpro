<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1746a2">
<title>TaskPro — Organize seus estudos</title>
<style>
:root{--blue:#1746a2;--blue2:#4f83e1;--bg:#f3f6fc;--ink:#17233b;--muted:#68758d;--line:#e3e9f4;--green:#18865b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink)}
header{background:linear-gradient(135deg,#12357f,#2864c7);color:white;padding:24px 18px 30px;border-radius:0 0 26px 26px}
.wrap{max-width:760px;margin:auto}header h1{margin:0;font-size:28px}header p{margin:5px 0 0;opacity:.9}
main{max-width:760px;margin:-14px auto 30px;padding:0 14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:white;border-radius:16px;padding:15px 8px;text-align:center;box-shadow:0 4px 16px #1a39750c}.stat strong{display:block;font-size:25px;color:var(--blue)}.stat span{font-size:12px;color:var(--muted)}
.actions{display:flex;gap:8px;margin:18px 0 12px}.btn{border:0;border-radius:12px;padding:12px 15px;font-weight:700;font-size:14px;cursor:pointer}.primary{background:var(--blue);color:white;flex:1}.secondary{background:white;color:var(--blue);border:1px solid var(--line)}
.filters{display:flex;gap:7px;overflow:auto;margin:10px 0 14px}.filter{border:1px solid var(--line);background:white;color:var(--muted);padding:9px 13px;border-radius:999px;white-space:nowrap}.filter.active{background:#e7efff;border-color:#b9cffb;color:var(--blue);font-weight:700}
.task{background:white;border:1px solid var(--line);border-radius:16px;padding:15px;margin:10px 0;box-shadow:0 4px 14px #1a397508}.tasktop{display:flex;gap:10px;align-items:flex-start}.check{width:22px;height:22px;margin-top:2px;accent-color:var(--green);flex-shrink:0}.taskbody{flex:1;min-width:0}.task h3{font-size:16px;margin:0 0 5px;overflow-wrap:anywhere}.task.done h3{text-decoration:line-through;color:var(--muted)}.meta{font-size:12px;color:var(--muted);margin:3px 0}.desc{font-size:14px;margin:8px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}.delete{border:0;background:#fff0f0;color:#b3261e;border-radius:9px;padding:8px 10px;font-weight:700}.empty{text-align:center;background:white;border:1px dashed #cbd6e8;border-radius:16px;padding:28px 15px;color:var(--muted)}.empty strong{display:block;color:var(--ink);margin-bottom:6px}
dialog{border:0;border-radius:20px;width:min(94%,520px);padding:0;box-shadow:0 20px 60px #0003}dialog::backdrop{background:#0b183a88}.modalhead{padding:18px 20px;background:#f7f9fe;border-bottom:1px solid var(--line)}.modalhead h2{margin:0;font-size:20px}.form{padding:18px 20px 20px}.field{display:block;margin-bottom:12px}.field span{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field textarea{width:100%;font:inherit;border:1px solid #ccd6e6;border-radius:10px;padding:11px;background:white;color:var(--ink)}.field textarea{min-height:76px;resize:vertical}.formbuttons{display:flex;gap:9px}.formbuttons button{flex:1}.notice{font-size:12px;color:var(--muted);text-align:center;margin:18px 0 8px}
@media(min-width:600px){header{padding:30px 24px 38px}main{padding:0 20px}.stat{padding:18px}}
</style>
</head>
<body>
<header><div class="wrap"><h1>📘 TaskPro</h1><p>Organize seus estudos, uma tarefa de cada vez.</p></div></header>
<main>
  <section class="stats" aria-label="Resumo das tarefas">
    <div class="stat"><strong id="total">0</strong><span>Total</span></div>
    <div class="stat"><strong id="pending">0</strong><span>Pendentes</span></div>
    <div class="stat"><strong id="completed">0</strong><span>Concluídas</span></div>
  </section>
  <div class="actions"><button class="btn primary" id="addBtn">＋ Adicionar tarefa</button><button class="btn secondary" id="clearDoneBtn">Limpar concluídas</button></div>
  <nav class="filters" aria-label="Filtrar tarefas">
    <button class="filter active" data-filter="all">Todas</button><button class="filter" data-filter="pending">Pendentes</button><button class="filter" data-filter="done">Concluídas</button>
  </nav>
  <section id="taskList" aria-live="polite"></section>
  <p class="notice">Suas tarefas ficam salvas neste navegador neste dispositivo.</p>
</main>
<dialog id="taskDialog">
  <div class="modalhead"><h2>Nova tarefa</h2></div>
  <form class="form" id="taskForm">
    <label class="field"><span>Título *</span><input id="title" maxlength="100" required placeholder="Ex.: Trabalho de Desenvolvimento Mobile"></label>
    <label class="field"><span>Matéria</span><input id="subject" maxlength="80" placeholder="Ex.: Desenvolvimento Mobile"></label>
    <label class="field"><span>Data de entrega</span><input id="dueDate" type="date"></label>
    <label class="field"><span>Descrição</span><textarea id="description" maxlength="500" placeholder="Detalhes da atividade (opcional)"></textarea></label>
    <div class="formbuttons"><button type="button" class="btn secondary" id="cancelBtn">Cancelar</button><button type="submit" class="btn primary">Salvar tarefa</button></div>
  </form>
</dialog>
<script>
const KEY='taskpro-tasks-v1';
let tasks=[];
let currentFilter='all';
try { const saved=localStorage.getItem(KEY); tasks=saved?JSON.parse(saved):[]; if(!Array.isArray(tasks))tasks=[]; } catch(e) { tasks=[]; }
const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks));}catch(e){alert('Não foi possível salvar neste navegador. Verifique o espaço disponível.');}}
function fmtDate(value){if(!value)return '';const [y,m,d]=value.split('-');return `${d}/${m}/${y}`;}
function render(){
 $('total').textContent=tasks.length;
 $('pending').textContent=tasks.filter(t=>!t.done).length;
 $('completed').textContent=tasks.filter(t=>t.done).length;
 const list=$('taskList'); list.replaceChildren();
 let visible=tasks.filter(t=>currentFilter==='all'||(currentFilter==='pending'&&!t.done)||(currentFilter==='done'&&t.done));
 visible.sort((a,b)=>{if(a.done!==b.done)return a.done?1:-1;if(!a.dueDate)return 1;if(!b.dueDate)return -1;return a.dueDate.localeCompare(b.dueDate);});
 if(!visible.length){const empty=document.createElement('div');empty.className='empty';const strong=document.createElement('strong');strong.textContent=tasks.length?'Nenhuma tarefa neste filtro':'Nenhuma tarefa por aqui ainda';const p=document.createElement('div');p.textContent=tasks.length?'Escolha outro filtro para ver suas tarefas.':'Toque em “Adicionar tarefa” para cadastrar a primeira.';empty.append(strong,p);list.append(empty);return;}
 visible.forEach(t=>{
  const card=document.createElement('article');card.className='task'+(t.done?' done':'');
  const top=document.createElement('div');top.className='tasktop';
  const check=document.createElement('input');check.type='checkbox';check.className='check';check.checked=!!t.done;check.setAttribute('aria-label','Marcar tarefa como concluída');check.addEventListener('change',()=>{tasks=tasks.map(x=>x.id===t.id?{...x,done:check.checked}:x);save();render();});
  const body=document.createElement('div');body.className='taskbody';
  const h=document.createElement('h3');h.textContent=t.title;body.append(h);
  if(t.subject){const m=document.createElement('div');m.className='meta';m.textContent='Matéria: '+t.subject;body.append(m);}
  if(t.dueDate){const m=document.createElement('div');m.className='meta';m.textContent='Entrega: '+fmtDate(t.dueDate);body.append(m);}
  if(t.description){const d=document.createElement('p');d.className='desc';d.textContent=t.description;body.append(d);}
  const del=document.createElement('button');del.className='delete';del.textContent='Excluir';del.addEventListener('click',()=>{if(confirm(`Excluir a tarefa “${t.title}”?`)){tasks=tasks.filter(x=>x.id!==t.id);save();render();}});
  top.append(check,body,del);card.append(top);list.append(card);
 });
}
$('addBtn').addEventListener('click',()=>{$('taskForm').reset();$('taskDialog').showModal();setTimeout(()=>$('title').focus(),80);});
$('cancelBtn').addEventListener('click',()=>$('taskDialog').close());
$('taskForm').addEventListener('submit',e=>{e.preventDefault();const title=$('title').value.trim();if(!title){$('title').focus();return;}tasks.push({id:Date.now(),title,subject:$('subject').value.trim(),dueDate:$('dueDate').value,description:$('description').value.trim(),done:false});save();render();$('taskDialog').close();});
document.querySelectorAll('[data-filter]').forEach(btn=>btn.addEventListener('click',()=>{currentFilter=btn.dataset.filter;document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b===btn));render();}));
$('clearDoneBtn').addEventListener('click',()=>{const n=tasks.filter(t=>t.done).length;if(!n){alert('Não há tarefas concluídas para limpar.');return;}if(confirm(`Excluir ${n} tarefa(s) concluída(s)?`)){tasks=tasks.filter(t=>!t.done);save();render();}});
render();
</script>
</body>
</html>
